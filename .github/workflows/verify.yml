name: Offline verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application-and-labs:
    runs-on: ubuntu-24.04
    env:
      AURA_LLM: 'off'
      # Tests enable AURA_LLM only around mocked local-model requests.
      GRANT_LLM: ollama
      MONGODB_URI: ''
      MONGO_URI: ''
      OPENALEX_API_KEY: ''
      GROQ_API_KEY: ''
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            Course-Project/backend/package-lock.json
            Course-Project/frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Course-Project/langgraph_edition/requirements-lock.txt
      - name: Install locked dependencies
        run: |
          npm --prefix Course-Project/backend ci
          npm --prefix Course-Project/frontend ci
          python -m pip install -r Course-Project/langgraph_edition/requirements-lock.txt
      - name: Main backend tests
        run: npm --prefix Course-Project/backend test
      - name: Frontend lint and build
        run: |
          npm --prefix Course-Project/frontend run lint -- --max-warnings 0
          npm --prefix Course-Project/frontend run build
      - name: Supplied lab trace checks
        run: python Course-Project/tools/verify_labs.py
      - name: Independent Python application
        working-directory: Course-Project/langgraph_edition
        run: python -m pytest -q
      - name: Retained lab-support suite
        working-directory: Course-Project/code/Lab_Support
        run: python -m pytest -q
      - name: Documentation and repository hygiene
        run: |
          python Course-Project/tools/check_docs.py
          python Course-Project/tools/check_repository.py
